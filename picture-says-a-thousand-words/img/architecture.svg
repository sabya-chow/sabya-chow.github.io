<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="How picture-says-a-thousand-words turns one question into one tabbed page with a local tutor chat">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c1c1a"/></marker>
    <style>
      text{font:14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1c1c1a}
      .s{font-size:12px;fill:#5d5d58}
      .b{fill:#fff;stroke:#c9c7bd;stroke-width:1.5}
      .k{fill:#eef3ff;stroke:#2a6df4;stroke-width:1.5}
      .o{fill:#fff4ec;stroke:#e8590c;stroke-width:1.5}
      .g{fill:#eefaf0;stroke:#2b8a3e;stroke-width:1.5}
      .l{stroke:#1c1c1a;stroke-width:1.6;fill:none}
      .d{stroke:#8b8b84;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="940" height="470" fill="#fafaf8"/>

  <rect class="b" x="20" y="30" width="150" height="62" rx="10"/>
  <text x="95" y="56" text-anchor="middle">Your question</text><text class="s" x="95" y="76" text-anchor="middle">"explain X"</text>

  <rect class="k" x="215" y="30" width="190" height="62" rx="10"/>
  <text x="310" y="56" text-anchor="middle">Step 0: ask first</text><text class="s" x="310" y="76" text-anchor="middle">which modes, what depth</text>
  <path class="l" d="M170 61H213" marker-end="url(#a)"/>

  <rect class="k" x="450" y="30" width="200" height="62" rx="10"/>
  <text x="550" y="56" text-anchor="middle">Content per mode</text><text class="s" x="550" y="76" text-anchor="middle">numbers checked by code</text>
  <path class="l" d="M405 61H448" marker-end="url(#a)"/>

  <rect class="g" x="700" y="30" width="220" height="62" rx="10"/>
  <text x="810" y="56" text-anchor="middle">Math narrative</text><text class="s" x="810" y="76" text-anchor="middle">math topics only: derivation</text>
  <path class="d" d="M650 61H698" marker-end="url(#a)"/>

  <!-- tabs -->
  <text class="s" x="20" y="148">One page, one tab per mode</text>
  <g>
    <rect class="o" x="20"  y="160" width="130" height="58" rx="10"/><text x="85"  y="184" text-anchor="middle">1 Animation</text><text class="s" x="85"  y="203" text-anchor="middle">argument in motion</text>
    <rect class="o" x="160" y="160" width="130" height="58" rx="10"/><text x="225" y="184" text-anchor="middle">2 Interactive</text><text class="s" x="225" y="203" text-anchor="middle">sliders, live numbers</text>
    <rect class="o" x="300" y="160" width="130" height="58" rx="10"/><text x="365" y="184" text-anchor="middle">3 Diagram</text><text class="s" x="365" y="203" text-anchor="middle">the chain, with reasons</text>
    <rect class="o" x="440" y="160" width="130" height="58" rx="10"/><text x="505" y="184" text-anchor="middle">M Flow map</text><text class="s" x="505" y="203" text-anchor="middle">click a step to open it</text>
    <rect class="o" x="580" y="160" width="160" height="58" rx="10"/><text x="660" y="184" text-anchor="middle">D Derivation</text><text class="s" x="660" y="203" text-anchor="middle">full text + you-are-here bar</text>
    <rect class="o" x="750" y="160" width="170" height="58" rx="10"/><text x="835" y="184" text-anchor="middle">4 STE-100 recap</text><text class="s" x="835" y="203" text-anchor="middle">short, strict, one action</text>
  </g>
  <path class="l" d="M550 92V158" marker-end="url(#a)"/>

  <!-- build -->
  <rect class="b" x="20" y="290" width="270" height="70" rx="10"/>
  <text x="155" y="318" text-anchor="middle">build_tabbed.py</text><text class="s" x="155" y="338" text-anchor="middle">inlines KaTeX (JS, CSS, fonts): works offline</text>
  <path class="l" d="M155 218V288" marker-end="url(#a)"/>

  <rect class="b" x="340" y="290" width="270" height="70" rx="10"/>
  <text x="475" y="318" text-anchor="middle">make_local_guide.py</text><text class="s" x="475" y="338" text-anchor="middle">adds the click-to-ask tutor chat</text>
  <path class="l" d="M290 325H338" marker-end="url(#a)"/>

  <rect class="g" x="660" y="270" width="260" height="110" rx="10"/>
  <text x="790" y="298" text-anchor="middle">Folder you open</text>
  <text class="s" x="790" y="320" text-anchor="middle">index.html (all tabs)</text>
  <text class="s" x="790" y="340" text-anchor="middle">ask_server.py (127.0.0.1 only)</text>
  <text class="s" x="790" y="360" text-anchor="middle">Start Guide.command (macOS)</text>
  <path class="l" d="M610 325H658" marker-end="url(#a)"/>

  <!-- ollama -->
  <rect class="b" x="660" y="410" width="260" height="42" rx="10"/>
  <text x="790" y="436" text-anchor="middle">Ollama (optional, local model)</text>
  <path class="d" d="M790 380V408" marker-end="url(#a)"/>

  <text class="s" x="20" y="410">Checks before delivery: every number computed by code, KaTeX renders with 0 errors,</text>
  <text class="s" x="20" y="428">one symbol set in every tab, no network requests, chat answered once for real.</text>
</svg>
